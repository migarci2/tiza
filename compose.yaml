name: tiza
services:
  gateway:
    build:
      context: .
      dockerfile: infra/containers/gateway.Dockerfile
    ports: ["${TIZA_HTTP_PORT:-8080}:80", "${TIZA_HTTPS_PORT:-8443}:443"]
    environment:
      TIZA_SITE_ADDRESS: ${TIZA_SITE_ADDRESS:-:80}
    volumes: ["caddy-data:/data", "caddy-config:/config"]
    depends_on: [api]
    restart: unless-stopped
  api: &backend
    build:
      context: .
      dockerfile: infra/containers/backend.Dockerfile
    env_file: .env
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn tiza.main:app --host 0.0.0.0 --port 8000"]
    environment:
      TIZA_REDIS_URL: redis://redis:6379/0
      TIZA_SMTP_HOST: mailpit
    volumes: ["app-data:/app/data"]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
  worker:
    <<: *backend
    command: ["celery", "-A", "tiza.jobs.worker:app", "worker", "--loglevel=WARNING", "--concurrency=1"]
    healthcheck: {disable: true}
    depends_on:
      api: {condition: service_healthy}
  beat:
    <<: *backend
    command: ["celery", "-A", "tiza.jobs.worker:app", "beat", "--loglevel=WARNING", "--schedule=/app/data/celerybeat-schedule"]
    healthcheck: {disable: true}
    depends_on:
      api: {condition: service_healthy}
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27.10
    profiles: [demo]
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped
volumes:
  app-data:
  redis-data:
  caddy-data:
  caddy-config:
